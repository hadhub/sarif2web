services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  flask:
    build: .
    environment:
      - MONGO_URI=mongodb://mongo:27017/sarif_manager
      - CODEQL_RAM=${CODEQL_RAM:-4096}
      - CODEQL_THREADS=${CODEQL_THREADS:-1}
      - CODEQL_TIMEOUT=${CODEQL_TIMEOUT:-0}
    depends_on:
      - mongo
    tmpfs:
      - /tmp/scan_repos:size=8G
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "9090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask
    restart: unless-stopped

volumes:
  mongo_data:
